[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

evm_version = "cancun"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

fuzz = { runs = 256, max_test_rejects = 65536 }

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"

[etherscan]
fuji = { key = "${FUJI_API_KEY}" }